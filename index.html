<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Card</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1F2A2E; font-family: Inter, system-ui, sans-serif; }
    #ar { position: fixed; inset: 0; }
    #start {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center; color: #F4EEDF; background: #1F2A2E;
    }
    #start h1 { margin: 0; font-size: 24px; }
    #start p { margin: 0; max-width: 300px; line-height: 1.45; opacity: .85; }
    #start button {
      font: 600 17px Inter, system-ui, sans-serif; color: #1F2A2E; background: #D9A441; border: 0; border-radius: 999px; padding: 14px 32px;
    }
    #msg { color: #e8a49b; min-height: 1.4em; }
  </style>
  <script src="./vendor/jsqr/jsQR.js"></script>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
  } }
  </script>
</head>
<body>
  <div id="ar"></div>
  <div id="start">
    <h1>AR Card</h1>
    <p>Allow camera access, then point your phone at the card.</p>
    <button id="go">Start</button>
    <p id="msg"></p>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from './vendor/mind-ar/mindar-image-three.prod.js';

    // Target space: card width = 1 unit, origin at card center, +y toward the top edge, +z out of the card.
    // QR center sits 22 mm below the top of the 50.8 x 88.9 mm card.
    const CARD_W = 50.8, CARD_H = 88.9;
    const QR_CENTER_Y = (CARD_H / 2 - 22) / CARD_W;
    const CUBE = 18 / CARD_W;

    // One shared page for every card: the QR link names the card (?card=<id>), and its tracking
    // data and cube colors load from cards/<id>/. A bare link opens willmore's card.
    const ID = /^[a-z0-9-]{1,40}$/;
    const param = new URLSearchParams(location.search).get('card') || 'willmore';
    let cardId = ID.test(param) ? param : 'willmore';
    const cardDir = `./cards/${cardId}`;
    const loadCard = id => fetch(`./cards/${id}/card.json`).then(r => r.ok ? r.json() : null).catch(() => null);
    const card = await loadCard(cardId);
    if (!card) {
      document.querySelector('#start p').textContent = 'This card could not be found. Check the QR code and try again.';
      document.querySelector('#go').remove();
      throw new Error(`unknown card ${cardId}`);
    }

    const mindar = new MindARThree({
      container: document.querySelector('#ar'),
      imageTargetSrc: ID.test(card.track || '') ? `./tracks/${card.track}.mind` : `${cardDir}/card.mind`,
      filterMinCF: 0.0005,
      filterBeta: 0.01,
      uiLoading: 'yes', uiScanning: 'yes', uiError: 'yes',
    });
    const { renderer, scene, camera } = mindar;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(0.6, 0.8, 1.2);
    scene.add(sun);

    const anchor = mindar.addAnchor(0);
    const model = new THREE.Group();
    model.position.set(0, QR_CENTER_Y, 0);
    anchor.group.add(model);

    // What floats above the QR code comes from card.json "object": the default colored cube, or
    // {"type": "neon", "src": <svg/png>, ...} for a glowing neon-sign version of an image.
    const obj = card.object || { type: 'cube' };
    const glowTex = (inner, outer) => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(64, 64, 10, 64, 64, 64);
      grad.addColorStop(0, inner); grad.addColorStop(1, outer);
      g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    };

    // Soft contact shadow under a cube; for a neon sign, its colored light spilling onto the card
    const neon = obj.type === 'neon';
    const neonColor = obj.color || '#6FE3FF';
    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(CUBE * (neon ? 2.6 : 1.9), CUBE * (neon ? 2.6 : 1.9)),
      new THREE.MeshBasicMaterial({
        map: neon ? glowTex(neonColor + 'AA', neonColor + '00') : glowTex('rgba(0,0,0,0.55)', 'rgba(0,0,0,0)'),
        transparent: true, depthWrite: false,
      })
    );
    shadow.position.z = 0.001;
    model.add(shadow);

    // Cube with one card-palette color per face
    const faces = (card.cube || ['#2F7F7A', '#2F7F7A', '#B5473A', '#B5473A', '#D9A441', '#5E7F3A'])
      .map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, emissive: c, emissiveIntensity: 0.3 }));
    const edgeMat = new THREE.LineBasicMaterial({ color: card.edge || '#1F2A2E' });

    // Neon sign: the image's shape drawn as a bright tube core inside layered colored glow
    const makeNeon = async () => {
      const img = new Image();
      img.src = obj.src;
      await img.decode();
      const aspect = (img.naturalWidth || 1) / (img.naturalHeight || 1);
      const S = 1024, pad = 0.22;
      const w = aspect >= 1 ? S : Math.round(S * aspect), h = aspect >= 1 ? Math.round(S / aspect) : S;
      const cw = Math.round(w * (1 + 2 * pad)), ch = Math.round(h * (1 + 2 * pad));
      const tint = color => {
        const c = document.createElement('canvas'); c.width = cw; c.height = ch;
        const g = c.getContext('2d');
        g.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
        g.globalCompositeOperation = 'source-in';
        g.fillStyle = color; g.fillRect(0, 0, cw, ch);
        return c;
      };
      const colored = tint(neonColor), core = tint(obj.core || '#F4FDFF');
      const out = document.createElement('canvas'); out.width = cw; out.height = ch;
      const g = out.getContext('2d');
      g.shadowColor = neonColor;
      // "glow" scales the blur radius and strength (1 = the original look, 0 = no glow)
      const glow = obj.glow ?? 1;
      if (glow > 0) {
        for (const [blur, alpha] of [[90, 0.9], [45, 0.9], [18, 1], [6, 1]]) {
          g.globalAlpha = Math.min(1, alpha * glow); g.shadowBlur = blur * Math.max(glow, 0.15); g.drawImage(colored, 0, 0);
        }
      }
      g.shadowBlur = 0; g.globalAlpha = 1;
      g.drawImage(core, 0, 0);
      const tex = new THREE.CanvasTexture(out);
      tex.colorSpace = THREE.SRGBColorSpace;
      const width = (obj.size_mm || 26) / CARD_W * (1 + 2 * pad), height = width * ch / cw;
      // Normal (not additive) blending so the glow still shows over the white QR plate
      const glowMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
      const plane = new THREE.PlaneGeometry(width, height);
      const sign = new THREE.Group();
      // "depth_mm" gives the sign thickness: solid silhouettes of the drawing stacked between its two glowing faces
      const depth = (obj.depth_mm || 0) / CARD_W;
      if (depth > 0) {
        const sideTex = new THREE.CanvasTexture(tint(obj.side || neonColor));
        sideTex.colorSpace = THREE.SRGBColorSpace;
        const sideMat = new THREE.MeshBasicMaterial({ map: sideTex, alphaTest: 0.5, side: THREE.DoubleSide });
        const n = Math.max(2, Math.round(obj.depth_mm * 8));
        for (let i = 0; i < n; i++) {
          const layer = new THREE.Mesh(plane, sideMat);
          layer.position.z = -depth / 2 + depth * i / (n - 1);
          sign.add(layer);
        }
      }
      for (const z of depth > 0 ? [depth / 2, -depth / 2] : [0]) {
        const face = new THREE.Mesh(plane, glowMat);
        face.position.z = z;
        sign.add(face);
      }
      sign.userData.glow = glowMat;
      if (!obj.upright) return sign;
      // "upright": stand the drawing up so its top points along the spin axis (the card's normal),
      // with the bottom of the drawing where the cube's bottom would be
      sign.rotation.x = Math.PI / 2;
      sign.position.z = height * h / ch / 2 - CUBE / 2;
      const holder = new THREE.Group();
      holder.add(sign);
      holder.userData.glow = glowMat;
      return holder;
    };

    let item = null, base = CUBE / 2;
    if (neon) item = await makeNeon().catch(e => { console.error('neon image failed, showing a cube', e); return null; });
    if (!item) {
      // "size_mm" sizes a cube too (default 18 mm); a neon sign that failed to load falls back to the default size
      const k = neon ? CUBE : (obj.size_mm || 18) / CARD_W;
      const geo = new THREE.BoxGeometry(k, k, k);
      item = new THREE.Mesh(geo, faces);
      item.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
      base = k / 2;
    }
    item.position.z = base;
    model.add(item);

    // Float above the QR code with a gentle bob. Each cycle the object makes one slow, eased turn,
    // then rests, turning around the card's normal (the axis pointing straight out of the card).
    // card.json "spin": {"period": s, "turn": s} sets the rhythm (default 6 s cycle, 2.5 s turn).
    const SPIN_PERIOD = (obj.spin && obj.spin.period) || 6, SPIN_TIME = (obj.spin && obj.spin.turn) || 2.5;
    // "hover_mm" / "bob_mm" set how high it floats and how far it bobs (default 10.8 and 2.16 mm);
    // "flicker" scales how often the neon flickers and "spill" its light on the card (1 = default, 0 = off)
    const HOVER = (obj.hover_mm ?? 10.8) / CARD_W, BOB = (obj.bob_mm ?? 2.16) / CARD_W, BOB_PERIOD = 3;
    const FLICKER = obj.flicker ?? 1, SPILL = obj.spill ?? 1;
    const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const clock = new THREE.Clock();
    let flickerUntil = 0, lastT = 0;
    const animate = () => {
      const t = clock.getElapsedTime();
      const lift = HOVER + BOB * Math.sin(t * 2 * Math.PI / BOB_PERIOD);
      item.position.z = base + lift;
      const phase = Math.min((t % SPIN_PERIOD) / SPIN_TIME, 1);
      const angle = (Math.floor(t / SPIN_PERIOD) + ease(phase)) * 2 * Math.PI;
      item.rotation.z = angle;
      const s = 1 - 0.35 * lift / Math.max(0.0001, HOVER + BOB);
      const dt = t - lastT; lastT = t;
      shadow.scale.set(s, s, 1);
      if (neon) {
        // Steady glow with the odd quick neon flicker
        // About one flicker every 4 s at flicker 1, whatever the frame rate
        if (t > flickerUntil && Math.random() < 1 - Math.pow(1 - Math.min(1, 0.004 * FLICKER), dt * 60)) flickerUntil = t + 0.18;
        const f = t < flickerUntil ? 0.35 + 0.65 * Math.random() : 1;
        item.userData.glow.opacity = f;
        shadow.material.opacity = (0.35 + 0.3 * s) * f * SPILL;
      } else {
        shadow.material.opacity = 0.35 + 0.5 * s;
      }
    };

    // Keep reading the QR code in view, so the cube matches the card the camera sees, not just the
    // card whose link opened the page. A card in the same group (same tracking file) swaps its cube
    // in place; any other card reloads the page for that card.
    const qrCanvas = document.createElement('canvas');
    const qrCtx = qrCanvas.getContext('2d', { willReadFrequently: true });
    let lastRead = null;
    const cardIdFromQr = text => {
      try {
        const url = new URL(text, location.href);
        if (url.origin !== location.origin || url.pathname.replace(/index\.html$/, '') !== location.pathname.replace(/index\.html$/, '')) return null;
        const id = url.searchParams.get('card') || 'willmore';
        return ID.test(id) ? id : null;
      } catch { return null; }
    };
    const checkQr = async () => {
      const video = mindar.video;
      if (!video || !video.videoWidth) return;
      const scale = Math.min(1, 960 / Math.max(video.videoWidth, video.videoHeight));
      qrCanvas.width = Math.round(video.videoWidth * scale);
      qrCanvas.height = Math.round(video.videoHeight * scale);
      qrCtx.drawImage(video, 0, 0, qrCanvas.width, qrCanvas.height);
      const img = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      const id = code && cardIdFromQr(code.data);
      // Act only when the same new card is read twice in a row, so a misread can't flip the cube
      const confirmed = id && id !== cardId && id === lastRead;
      lastRead = id;
      if (!confirmed) return;
      const next = await loadCard(id);
      if (!next) return;
      cardId = id;
      history.replaceState(null, '', `?card=${id}`);
      if (next.track && next.track === card.track && !neon && !next.object && !card.object) {
        (next.cube || []).forEach((c, i) => { if (faces[i]) { faces[i].color.set(c); faces[i].emissive.set(c); } });
        edgeMat.color.set(next.edge || '#1F2A2E');
      } else {
        location.replace(`?card=${id}&autostart`);
      }
    };

    const startEl = document.querySelector('#start'), msg = document.querySelector('#msg');
    document.querySelector('#go').addEventListener('click', async () => {
      msg.textContent = '';
      try {
        await mindar.start();
        startEl.remove();
        renderer.setAnimationLoop(() => { animate(); renderer.render(scene, camera); });
        setInterval(() => checkQr().catch(console.error), 700);
      } catch (e) {
        msg.textContent = 'Could not open the camera. Check camera permission and try again.';
        console.error(e);
      }
    });
    if (new URLSearchParams(location.search).has('autostart')) document.querySelector('#go').click();
  </script>
</body>
</html>
