<!doctype html><html><body><script type="module">
// Compiles a card image into MindAR tracking data (card.mind). Driven by compile_target.js.
import { Compiler } from '../vendor/mind-ar/mindar-image.prod.js';
window.run = async (src) => {
  const img = new Image(); img.src = src; await img.decode();
  const c = new Compiler();
  await c.compileImageTargets([img], () => {});
  const u = new Uint8Array(await c.exportData());
  let s = '';
  for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192));
  return btoa(s);
};
window.ready = true;
</script></body></html>
